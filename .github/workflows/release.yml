name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node --input-type=module -e 'import fs from "node:fs";
          const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const expected = `v${version}`;
          if (process.env.RELEASE_TAG !== expected) {
            console.error(`Release tag ${process.env.RELEASE_TAG} does not match package version ${expected}`);
            process.exit(1);
          }'

      - name: Run release gates
        run: pnpm run check

      # GitHub OIDC Trusted Publishing：无长期 NPM_TOKEN；需在 npm 侧绑定本仓库 + 本 workflow 后生效。
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
