name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      # npm Trusted Publishing requires npm >= 11.5.1 and Node >= 22.14.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify main CI, annotated tag and unused version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release.mjs

      - name: Run release gates
        run: pnpm run check

      - name: Isolated browser UI gate
        run: pnpm test:ui
        env:
          PREVISIT_CHROME: /usr/bin/google-chrome

      - name: Inspect publish contents
        run: npm pack --dry-run --ignore-scripts

      # GitHub OIDC Trusted Publishing：无长期 NPM_TOKEN；需在 npm 侧绑定本仓库 + 本 workflow 后生效。
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Verify Registry and provenance
        run: node scripts/verify-published.mjs

      - name: Retain readback evidence
        uses: actions/upload-artifact@v4
        with:
          name: registry-evidence-${{ github.ref_name }}
          path: _scratch/release/registry-evidence.json
