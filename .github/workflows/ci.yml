name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.19.0'
            sidebar: '0.17.1'
            dsh-sdk: '0.1.1-rc.2'
          - node: '24'
            sidebar: '0.17.1'
            dsh-sdk: '0.1.1-rc.2'
          - node: '22.19.0'
            sidebar: '0.18.1'
            dsh-sdk: '0.1.2-rc.1'
          - node: '24'
            sidebar: '0.18.1'
            dsh-sdk: '0.1.2-rc.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Install paired Sidebar and DSH SDK contracts
        env:
          SIDEBAR_VERSION: ${{ matrix.sidebar }}
          DSH_SDK_VERSION: ${{ matrix.dsh-sdk }}
        run: pnpm add -D --ignore-scripts "dsh-better-sidebar@$SIDEBAR_VERSION" "@deepseek-ai/dsh-client-ui-primitives@$DSH_SDK_VERSION" "@deepseek-ai/dsh-invariants@$DSH_SDK_VERSION"

      - name: Typecheck paired SDK contracts
        run: pnpm typecheck

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Isolated browser UI (not real DSH)
        run: pnpm test:ui
        env:
          PREVISIT_CHROME: /usr/bin/google-chrome

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Retain isolated UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.node }}-${{ matrix.sidebar }}-${{ matrix.dsh-sdk }}
          retention-days: 7
          path: |
            _scratch/ui-layout/*.png
            _scratch/ui-layout/*.dom.html
            _scratch/ui-layout/*.browser.log
            _scratch/ui-layout/results.json
