<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>访前报告与证据</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,sans-serif;color:var(--color-text-primary,#162d44);background:var(--color-background-primary,#f4f7fb)}*{box-sizing:border-box}body{margin:0;padding:22px}main{max-width:1060px;margin:auto}h1{font-size:24px}h2{font-size:18px}p{line-height:1.7;overflow-wrap:anywhere}small,.muted{color:var(--color-text-secondary,#536477)}.badge{color:#0875d1;font-weight:700}section,aside{border:1px solid #9cabb540;border-radius:12px;padding:18px;background:var(--color-background-secondary,#ffffff)}.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;margin-top:18px}.cards{display:grid;gap:10px}button{font:inherit;text-align:left;padding:14px;border:1px solid #128bed70;border-radius:8px;background:transparent;color:inherit;cursor:pointer}button:focus-visible{outline:3px solid #128bed}button:disabled{opacity:.55;cursor:wait}#status{padding:10px 0}#evidence{white-space:pre-wrap;overflow-wrap:anywhere}.coverage{padding:8px 0;border-bottom:1px solid #9cabb530}a{color:inherit}nav{display:flex;flex-wrap:wrap;gap:12px}article{scroll-margin-top:16px}#error{color:#b3261e} @media(prefers-color-scheme:dark){:root{color:var(--color-text-primary,#e9f0f8);background:var(--color-background-primary,#14212d)}section,aside{background:var(--color-background-secondary,#1e2d3c)}.muted,small{color:#b8c6d4}.badge{color:#82c3ff}#error{color:#ffb4ab}}@media(max-width:650px){body{padding:12px}.grid{grid-template-columns:1fr}button{font-size:16px}h1{font-size:21px}}
</style></head><body><main><span class="badge">访前尽调 · 合成数据实验</span><h1 id="title">等待已保存报告</h1><p id="meta" class="muted"></p><p id="status" role="status">正在连接宿主…</p><p id="error" role="alert"></p><div id="report" hidden><section><h2>核心判断</h2><p id="summary"></p><div id="findings" class="cards"></div></section><div class="grid"><section><nav id="nav" aria-label="八段报告导航"></nav><div id="sections"></div></section><aside><h2>判断依据</h2><p id="evidence" role="status">点击上方判断，读取本版本已保存证据。</p><h2>覆盖与缺口</h2><div id="coverage"></div><h2>已有交付文件</h2><p>本合成报告无已登记文件。</p><p id="limitations" class="muted"></p></aside></div></div></main><script type="module">/* APP_BUNDLE */</script></body></html>
